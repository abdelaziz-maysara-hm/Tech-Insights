name: Build Desktop Tools

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file EXE
        run: |
          cd desktop/NetSecAtlasTools
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ${{ github.workspace }}/publish

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: NetSecAtlasTools
          path: publish/NetSecAtlasTools.exe
          retention-days: 7
