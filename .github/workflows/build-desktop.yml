name: Build Desktop Tools

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file EXE
        run: |
          cd desktop/NetSecAtlasTools
          dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ${{ github.workspace }}/publish

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v1.0
          name: NetSec Atlas Tools v1.0
          body: |
            Ready-to-run Windows desktop tools.

            **Included**
            - Subnet Calculator
            - VLSM Calculator
            - Common Ports Lookup

            Download `NetSecAtlasTools.exe`, run it. No install needed.
          files: |
            publish/NetSecAtlasTools.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
