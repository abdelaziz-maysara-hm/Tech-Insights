name: Deploy NetSec Atlas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "artifacts/techpulse-ar/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages preview
        env:
          BASE_PATH: /
          # Optional; set under Settings → Secrets and variables → Actions → Variables.
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: pnpm --filter @workspace/techpulse-ar run build

      - name: Verify built pages (static content, RSS links, sitemap URLs)
        run: pnpm --filter @workspace/techpulse-ar run test:build-output

      - name: Content and SEO checks
        run: |
          pnpm --filter @workspace/techpulse-ar run test:phase7
          pnpm --filter @workspace/techpulse-ar run test:seo-prerender

      # The custom domain is configured in Settings -> Pages (build type:
      # GitHub Actions). Keep CNAME in the artifact as well so the domain is
      # documented in the deployed site and survives any switch back to
      # branch-based Pages. Fail loudly if it ever goes missing or changes.
      - name: Verify custom domain (CNAME) is present
        run: |
          test "$(tr -d '[:space:]' < artifacts/techpulse-ar/dist/public/CNAME)" = "netsecatlas.com"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/techpulse-ar/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
