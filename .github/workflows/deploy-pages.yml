name: Deploy NetSec Atlas to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "artifacts/techpulse-ar/**"
      - ".github/workflows/deploy-pages.yml"
  # Re-deploy after a desktop release so /downloads/ serves the new exe.
  workflow_run:
    workflows: [desktop-ci]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'desktop-v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so sitemap <lastmod> can use each item's git date.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages preview
        env:
          BASE_PATH: /
          # Optional; set under Settings → Secrets and variables → Actions → Variables.
          VITE_GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ vars.BING_SITE_VERIFICATION }}
        run: pnpm --filter @workspace/techpulse-ar run build

      # Same-domain downloads: copy the latest desktop release assets into
      # /downloads/ so the site's download buttons save the file directly.
      - name: Add NetSec Atlas Tools downloads (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=artifacts/techpulse-ar/dist/public/downloads
          mkdir -p "$out"
          gh release download --repo "$GITHUB_REPOSITORY" --pattern 'NetSecAtlasTools*.exe' --pattern 'SHA256SUMS.txt' --dir "$out" --clobber \
            || echo "::warning::could not download desktop release assets"
          ls -la "$out"
          test -s "$out/NetSecAtlasTools.exe"
          if [ -f "$out/SHA256SUMS.txt" ]; then (cd "$out" && sha256sum -c SHA256SUMS.txt); fi

      - name: Verify built pages (static content, RSS links, sitemap URLs)
        run: pnpm --filter @workspace/techpulse-ar run test:build-output

      - name: Content and SEO checks
        run: |
          pnpm --filter @workspace/techpulse-ar run test:phase7
          pnpm --filter @workspace/techpulse-ar run test:phase8
          pnpm --filter @workspace/techpulse-ar run test:seo-prerender

      # The custom domain is configured in Settings -> Pages (build type:
      # GitHub Actions). Keep CNAME in the artifact as well so the domain is
      # documented in the deployed site and survives any switch back to
      # branch-based Pages. Fail loudly if it ever goes missing or changes.
      - name: Verify custom domain (CNAME) is present
        run: |
          test "$(tr -d '[:space:]' < artifacts/techpulse-ar/dist/public/CNAME)" = "netsecatlas.com"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: artifacts/techpulse-ar/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify-indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Wait until GitHub Pages is serving this deploy
        run: |
          set +e
          key=13a10f8dd925f0cae8bb47017b2b8ba2
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/indexnow-key.txt -w "%{http_code}" "https://netsecatlas.com/${key}.txt" || echo 000)
            robots=$(curl -sS "https://netsecatlas.com/ar/search" | grep -o 'name="robots" content="[^"]*"' | head -1)
            search_hits=$(curl -sS "https://netsecatlas.com/sitemap.xml" | grep -c "/search" || true)
            echo "wait $i: key_http=$code robots=$robots search_in_sitemap=$search_hits"
            if [ "$code" = "200" ] && [ "$(tr -d '[:space:]' < /tmp/indexnow-key.txt)" = "$key" ] && echo "$robots" | grep -q noindex && [ "$search_hits" = "0" ]; then
              echo "live site is current"
              exit 0
            fi
            sleep 15
          done
          echo "::warning::Pages did not show the new sitemap within the wait window; IndexNow will still be attempted"
          exit 0

      - name: Submit published URLs to IndexNow
        working-directory: artifacts/techpulse-ar
        run: node scripts/indexnow.mjs --sitemap https://netsecatlas.com/sitemap.xml
